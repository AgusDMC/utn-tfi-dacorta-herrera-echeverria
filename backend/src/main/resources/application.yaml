spring:
  application:
    name: inmobiliaria-api
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  # En local lee las variables de backend/.env (si existe)
  config:
    import: optional:file:.env[.properties]

  datasource:
    # Por defecto la base local
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inmobiliaria}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    web:
      pageable:
        max-page-size: 100

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    # Por defecto, relativo a backend/
    locations: ${FLYWAY_LOCATIONS:filesystem:../database/migrations}

  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 60

  notificacion:
    remitente: ${EMAIL_REMITENTE}
    nombre-remitente: ${NOMBRE_REMITENTE}
    destinatario: ${EMAIL_DESTINATARIO}

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}